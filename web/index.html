<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Onedev Track - Freelance Client Tracking Portal">

  <!-- Content Security Policy (CSP) for Flutter Web -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://fonts.googleapis.com; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https://onedev.ovh https://www.gstatic.com https://fonts.gstatic.com https://fonts.googleapis.com; frame-src 'self' data: blob:;">

  <!-- Preconnect Google Fonts for Arabic Cairo font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="onedev_track">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Onedev Track</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0F172A;
      font-family: 'Cairo', 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0F172A;
      z-index: 999999;
      transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
    }

    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 48px;
      background-color: #1E293B;
      border: 1px solid #334155;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .loader-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
    }

    .loader-title {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loader-card">
      <div class="loader-icon">🚀</div>
      <div class="loader-title">OneDev Track</div>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    // MutationObserver يضمن إخفاء الشاشة الحاكمة فقط بعد رسم أول عنصر لـ Flutter في الـ DOM بنجاح
    (function() {
      function hideLoader() {
        var loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          setTimeout(function() {
            if (loader && loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 300);
        }
      }

      var observer = new MutationObserver(function(mutations, obs) {
        var flutterMounted = document.querySelector('flt-glass-pane') ||
                             document.querySelector('flutter-view') ||
                             document.querySelector('flt-scene') ||
                             document.querySelector('canvas');
        if (flutterMounted) {
          // التأكد من جاهزية الرسم الكامل للواجهة قبل الإخفاء
          setTimeout(hideLoader, 150);
          obs.disconnect();
        }
      });

      if (document.body) {
        observer.observe(document.body, { childList: true, subtree: true });
      } else {
        window.addEventListener('DOMContentLoaded', function() {
          observer.observe(document.body, { childList: true, subtree: true });
        });
      }

      // Fallback أمان في حال تأخرت الاستجابة لأي سبب
      setTimeout(hideLoader, 4000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
